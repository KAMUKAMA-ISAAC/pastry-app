<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pastry Quin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

olor:var(--ink);width:100%;min-width:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:11px;border-bottom:1px solid var(--line)}td{font-size:13px;padding:12px 10px;border-bottom:1px solid #f0e9e2}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.pill{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:800}.paid{background:#e5f0e5;color:var(--green)}.part{background:#f8edd9;color:var(--gold)}.unpaid{background:#f4e4e1;color:var(--red)}.link{border:0;background:none;color:var(--rose);font-weight:750;cursor:pointer;padding:3px}.empty{text-align:center;padding:35px;color:var(--muted)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.login{width:min(410px,100%);padding:28px}.login h1{margin:8px 0 14px}.login .field{margin:14px 0}.notice{background:#f6eee4;border:1px solid var(--line);padding:11px;border-radius:9px;font-size:12px;color:#705d50}.modalback{position:fixed;inset:0;background:#21171388;display:grid;place-items:center;padding:14px;z-index:4}.modal{width:min(570px,100%);max-height:92vh;overflow:auto;padding:22px}.modal h2{margin-bottom:16px}.modalfoot{justify-content:flex-end;margin-top:18px}.payrow{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px}.reportgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.reportgrid .card{background:#faf5ef}.toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:white;padding:12px 16px;border-radius:9px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}@media(max-width:850px){.cards,.reportgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.shell{padding:13px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:12p /* Dashboard usability refinements */

@media(max-width:650px){.mainmetrics{grid-template-columns:1fr 1fr}.mainmetrics .card:first-child{grid-column:1/-1}.mainmetrics .card:first-child strong{font-size:24px}.secondarymetrics .cards{grid-template-columns:1fr 1fr}.quickstart{grid-template-columns:1fr}.quickbox{align-items:flex-start}.quickbox .btn{white-space:nowrap}.top{align-items:flex-start}.top .actions{width:100%;justify-content:flex-end}.cards{gap:8px}.card strong{white-space:normal;overflow-wrap:anywhere}.tabs{gap:4px}.tab{padding:8px 10px;font-size:13px}}

}
@supports (-webkit-touch-callout:none){
  input,select,textarea{font-size:16px!important}

/* Consistent search and filter alignment across screen sizes */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.filterbar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(190px,230px) auto;align-items:end;gap:12px}
.search-control{min-width:0}
.search-control input{display:block;width:100%;min-width:0;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:15px;outline:none}
.search-control input:focus,.field input:focus,.field select:focus{border-color:var(--rose);box-shadow:0 0 0 3px #b9787020}
.filterbar .month-control{min-width:0;width:100%}
#count{align-self:center;justify-self:end;font-size:12px;white-space:nowrap;padding-bottom:12px}
.report-toolbar{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr)) auto auto;align-items:end;gap:12px}
.report-toolbar .field{min-width:0;width:100%}

.panel .head>.field{min-width:170px}
@media(max-width:700px){
 .filterbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

}
@media(max-width:380px){
 .filterbar{grid-template-columns:minmax(0,1fr)}

 #count{justify-self:start;padding:0}

</style></head><body>
<div id="loginView" class="loginwrap"><div class="login"><div class="brand"><img class="logo" src="https://raw.githubusercontent.com/KAMUKAMA-ISAAC/pastry-app/main/frontend/public/pq-icon-192.png" alt="Pastry Quin logo"><div><h1>Pastry Quin</h1></div></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="signIn" class="btn rose" style="width:100%">Sign in</button><p id="loginError" class="muted"></p></div></div>
<div id="app" class="hidden"><div class="shell"><header class="top"><div class="brand"><img class="logo" src="https://raw.githubusercontent.com/KAMUKAMA-ISAAC/pastry-app/main/frontend/public/pq-icon-192.png" alt="Pastry Quin logo"><div><h1>Pastry Quin</h1></div></div><div class="actions"><button id="signOut" class="btn light small">Sign out</button></div></header>
<nav class="tabs"><button class="tab active" data-page="dash">Home</button><button class="tab" data-page="orders">Cake records</button><button class="tab" data-page="reports">Financial reports</button></nav>
<section id="dashPage"><div class="head dashwelcome"><div><div class="eyebrow" id="welcomeDate">TODAY</div></div><button class="btn rose" id="new1">＋ New order</button></div><div class="dashactions"><button class="btn light" id="quickFind">Find customer</button></div><div id="dashCards" class="cards mainmetrics"></div><div id="moreDetails"><div class="secondarymetrics"><div class="secondarylabel">More finances</div><div id="dashExtra" class="cards"></div></div><div class="panel"><div class="head"><h2>Recent orders</h2><button class="btn light small" id="viewAll">View all</button></div><div id="recent"></div></div><div class="panel"><div class="head"><h2>Monthly summary</h2><div class="field"><label for="month">Select month</label><input type="month" id="month"></div></div><div id="monthly" class="cards"></div></div></section>
<section id="ordersPage" class="hidden"><div class="head"><h2>Cake records</h2><button class="btn rose" id="new2">＋ New cake order</button></div><div class="panel"><div class="toolbar filterbar" style="margin-bottom:15px"><div class="search-control"><label class="sr-only" for="search">Search cake records by customer name</label><input id="search" type="search" placeholder="Search by customer name…" autocomplete="off" aria-label="Search cake records by customer name"></div><div class="field month-control"><label for="orderMonthFilter">Show records for</label><select id="orderMonthFilter" aria-label="Filter cake records by month"><option value="">All months</option></select></div><span id="count" class="muted" aria-live="polite"></span></div><div id="orderTable"></div></div></section>
<section id="reportsPage" class="hidden"><div class="head"><h2>Financial reports</h2><div class="field"><label>Period</label><select id="period"><option value="day">Daily</option><option value="week">Weekly</option><option value="month" selected>Monthly</option><option value="year">Yearly</option></select></div></div><div class="panel"><div class="toolbar report-toolbar"><div class="field"><label for="from">From</label><input id="from" type="date"></div><div class="field"><label for="to">To</label><input id="to" type="date"></div><button id="generate" class="btn light small">Generate</button><button id="csv" class="btn light small">Export CSV</button></div><div id="report" style="margin-top:16px"></div></div></section></div></div>
<div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
let URL_CFG=localStorage.getItem('pq_url')||'',KEY_CFG=localStorage.getItem('pq_key')||'';
let db,orders=[],payments=[],sessionUser;
const $=id=>document.getElementById(id),money=n=>'UGX '+Number(n||0).toLocaleString('en-UG',{maximumFractionDigits:0}),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paid=o=>payments.filter(p=>p.order_id===o.id).reduce((a,p)=>a+Number(p.amount),0),bal=o=>Number(o.total_price)-paid(o),profit=o=>Number(o.total_price)-Number(o.expense),status=o=>paid(o)===0?'Unpaid':bal(o)===0?'Paid':'Partially Paid';
const total=(xs,fn)=>xs.reduce((a,x)=>a+fn(x),0),metrics=xs=>[{n:'Total cake sales',v:total(xs,o=>+o.total_price)},{n:'Production expenses',v:total(xs,o=>+o.expense)},{n:'Total profit',v:total(xs,profit)},{n:'Payments received',v:total(xs,paid)},{n:'Outstanding balances',v:total(xs,bal)}];
function cards(xs){const hints={'Total cake sales':'Full selling value of orders','Production expenses':'Click to see expenses by order','Total profit':'Sales minus production expenses','Payments received':'Money customers have paid','Outstanding balances':'Money customers still owe','Total Balance':'Unpaid customer balances','To the Bank':'Recorded bank deposits + manual adjustments'};return xs.map(x=>'<div class="card"><small>'+x.n+'</small><strong>'+money(x.v)+'</strong><span class="hint">'+(hints[x.n]||'For the selected period')+'</span></div>').join('')}
function expenseBreakdown(xs,title){const totalExpense=total(xs,o=>Number(o.expense||0));openModal(title,'<p class="muted">'+xs.length+' orders · Total '+money(totalExpense)+'</p>'+(xs.length?'<div class="tablewrap"><table><thead><tr><th>Order date</th><th>Customer</th><th>Cake type</th><th class="num">Expense (UGX)</th></tr></thead><tbody>'+pqChronological(xs).map(o=>'<tr><td>'+date(o.order_date)+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.cake_type||'—')+'</td><td class="num">'+money(o.expense||0)+'</td></tr>').join('')+'</tbody><tfoot><tr><th colspan="3">Total expenses</th><th class="num">'+money(totalExpense)+'</th></tr></tfoot></table></div>':'<p class="empty">No orders in this period.</p>'),()=>close());if($('save'))$('save').style.display='none'}
window.expenseBreakdownFor=function(scope){let xs=orders;if(scope==='monthly'){const m=$('month').value||today().slice(0,7);xs=orders.filter(o=>o.order_date.startsWith(m))}else if(scope==='report'){const s=$('from').value,e=$('to').value;xs=orders.filter(o=>(!s||o.order_date>=s)&&(!e||o.order_date<=e))}expenseBreakdown(xs,scope==='monthly'?'Monthly expenses breakdown':scope==='report'?'Expenses breakdown':'All order expenses')};
function expenseCard(n,v,scope){return '<button type="button" class="card expense-click" style="text-align:left;width:100%;cursor:pointer" onclick="expenseBreakdownFor(\''+scope+'\')"><small>'+n+'</small><strong>'+money(v)+'</strong><span class="hint">Click to view order breakdown</span></button>'}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function date(s){return s?new Date(s+'T00:00:00').toLocaleDateString('en-GB'):'—'}
function pill(o){let s=status(o);return '<span class="pill '+(s==='Paid'?'paid':s==='Unpaid'?'unpaid':'part')+'">'+s+'</span>'}
function row(o){return '<tr><td data-label="Date">'+date(o.order_date)+'</td><td data-label="Customer / cake"><b>'+esc(o.customer_name)+'</b><br><span class="muted">'+esc(o.cake_type||'')+'</span></td><td data-label="Paid" class="num">'+money(paid(o))+'</td><td data-label="Balance" class="num">'+money(bal(o))+'</td><td data-label="Total" class="num">'+money(o.total_price)+'</td><td data-label="Expense" class="num">'+money(o.expense)+'</td><td data-label="Profit" class="num">'+money(profit(o))+'</td><td data-label="Status">'+pill(o)+'</td><td data-label="Actions"><details class="action-menu"><summary>Actions</summary><div class="action-options"><button type="button" data-order="'+o.id+'" onclick="payment(this.dataset.order);this.parentElement.parentElement.open=false">Record payment</button><button type="button" data-order="'+o.id+'" onclick="edit(this.dataset.order);this.parentElement.parentElement.open=false">Edit order</button><button type="button" class="danger" data-order="'+o.id+'" onclick="removeOrder(this.dataset.order);this.parentElement.parentElement.open=false">Delete order</button></div></details></td></tr>'}
function table(xs){return xs.length?'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer / cake</th><th class="num">Paid</th><th class="num">Balance</th><th class="num">Total</th><th class="num">Expense</th><th class="num">Profit</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+pqChronological(xs).map(row).join('')+'</tbody></table></div>':'<div class="empty">No cake records yet. Add your first order.</div>'}
/* Keep each Actions menu attached to its trigger and fully visible on screen. */
document.addEventListener('toggle',e=>{
  const d=e.target;
  if(!d.matches?.('details.action-menu'))return;
  const menu=d.querySelector('.action-options');
  if(!d.open){menu.style.left='-9999px';return}
  const trigger=d.querySelector('summary'),r=trigger.getBoundingClientRect();
  menu.style.left='0px';menu.style.top='0px';
  requestAnimationFrame(()=>{
    const w=menu.offsetWidth,h=menu.offsetHeight,g=8;
    const left=Math.max(g,Math.min(r.right-w,window.innerWidth-w-g));
    const top=r.bottom+h+g<=window.innerHeight? r.bottom+5 : Math.max(g,r.top-h-5);
    menu.style.left=left+'px';menu.style.top=top+'px';
  });
},true);
document.addEventListener('click',e=>{
  document.querySelectorAll('details.action-menu[open]').forEach(d=>{
    if(!d.contains(e.target))d.open=false;
  });
});
window.addEventListener('scroll',()=>{
  document.querySelectorAll('details.action-menu[open]').forEach(d=>d.open=false);
},true);

/* Monthly bank deposits: each transfer is its own editable, deletable record. */
refresh=async function(){await pqOriginalRefresh();const q=await db.from('monthly_bank_deposit_records').select('*').order('deposited_at',{ascending:false});if(q.error)throw q.error;monthlyBankEntries=q.data||[];render()};
function pqMonthlyBankAmount(month){return monthlyBankEntries.filter(x=>x.month_key===month).reduce((sum,x)=>sum+Number(x.amount||0),0)}
function pqBankRecordRows(month){const xs=monthlyBankEntries.filter(x=>x.month_key===month).sort((a,b)=>new Date(b.deposited_at)-new Date(a.deposited_at));if(!xs.length)return '<p class="muted">No deposits have been recorded for this month yet.</p>';return '<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Date deposited</th><th class="num">Amount</th><th>Actions</th></tr></thead><tbody>'+xs.map(x=>'<tr><td>'+new Date(x.deposited_at).toLocaleDateString('en-UG',{day:'numeric',month:'short',year:'numeric'})+'</td><td class="num">'+money(x.amount)+'</td><td><button class="link" onclick="editMonthlyBankRecord(\''+x.id+'\')">Edit</button> <button class="link" onclick="deleteMonthlyBankRecord(\''+x.id+'\')">Delete</button></td></tr>').join('')+'</tbody></table></div>'}
window.monthlyBankModal=function(month){const total=pqMonthlyBankAmount(month);openModal('To the Bank · '+month,'<p class="muted">Add each separate transfer made to the bank. Every entry is added to this month’s total.</p><div class="card" style="margin:12px 0"><small>Total deposited in '+month+'</small><strong>'+money(total)+'</strong></div><h3 style="font:16px Georgia;margin:15px 0 8px">Deposit records</h3>'+pqBankRecordRows(month)+'<div class="formgrid" style="margin-top:17px"><div class="field"><label>Date deposited</label><input id="pqNewBankDate" type="date" value="'+today()+'" required></div><div class="field"><label>Amount deposited (UGX)</label><input id="pqNewBankAmount" type="number" min="1" step="1" placeholder="Enter amount" required></div></div>',async()=>{const raw=$('pqNewBankAmount').value.trim(),amount=Number(raw),date=$('pqNewBankDate').value;if(!raw||!date||date.slice(0,7)!==month||!Number.isFinite(amount)||amount<=0){toast('Enter a valid positive amount and a date within '+month+'.');return}const r=await db.from('monthly_bank_deposit_records').insert({month_key:month,amount,deposited_at:new Date(date+'T12:00:00').toISOString(),owner_id:sessionUser.id});if(r.error){toast(r.error.message);return}close();await refresh();toast('Bank deposit added to '+month)})};
window.editMonthlyBankRecord=function(id){const x=monthlyBankEntries.find(z=>z.id===id);if(!x)return;const date=new Date(x.deposited_at).toLocaleDateString('en-CA');openModal('Edit bank deposit','<div class="formgrid"><div class="field"><label>Date deposited</label><input id="pqEditMonthlyBankDate" type="date" value="'+date+'" required></div><div class="field"><label>Amount deposited (UGX)</label><input id="pqEditMonthlyBankAmount" type="number" min="1" step="1" value="'+x.amount+'" required></div></div>',async()=>{const raw=$('pqEditMonthlyBankAmount').value.trim(),amount=Number(raw),d=$('pqEditMonthlyBankDate').value;if(!raw||!d||d.slice(0,7)!==x.month_key||!Number.isFinite(amount)||amount<=0){toast('Enter a valid amount and a date within '+x.month_key+'.');return}const r=await db.from('monthly_bank_deposit_records').update({amount,deposited_at:new Date(d+'T12:00:00').toISOString()}).eq('id',id);if(r.error){toast(r.error.message);return}close();await refresh();toast('Bank deposit updated')})};
window.deleteMonthlyBankRecord=async function(id){if(!confirm('Delete this bank deposit record? This will reduce that month’s total.'))return;const r=await db.from('monthly_bank_deposit_records').delete().eq('id',id);if(r.error){toast(r.error.message);return}close();await refresh();toast('Bank deposit deleted')};
monthly=function(){const m=$('month').value||today().slice(0,7),xs=orders.filter(o=>o.order_date.startsWith(m)),b=total(xs,bal),p=total(xs,profit),expenses=total(xs,o=>Number(o.expense||0)),bank=pqMonthlyBankAmount(m);$('monthly').innerHTML=cards([{n:'Total Balance',v:b},{n:'Total Profit',v:p}])+expenseCard('Total expenses',expenses,'monthly')+'<button type="button" class="card" style="text-align:left;width:100%;cursor:pointer" onclick="monthlyBankModal(\''+m+'\')"><small>To the Bank · '+m+'</small><strong>'+money(bank)+'</strong><span class="hint">Manage individual deposits for this month</span></button>'};
function pqUpdateDashBank(){const m=$('month')?.value||today().slice(0,7),bank=pqMonthlyBankAmount(m),el=$('dashCards');if(el){const old=document.getElementById('pqDashBank');if(old)old.remove();el.insertAdjacentHTML('beforeend','<button type="button" class="card" id="pqDashBank" style="text-align:left;width:100%;cursor:pointer" onclick="monthlyBankModal(\''+m+'\')"><small>To the Bank · '+m+'</small><strong>'+money(bank)+'</strong><span class="hint">Selected month only · click to manage deposits</span></button>')}};
row=pqOldRow;
$('month').onchange=()=>{monthly();pqUpdateDashBank()};

range();report();

</script></body></html>
